<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Mã Đơn V2</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>

<body>

<div class="container">

    <h1>📦 Check Mã Đơn V2</h1>

    <input
        type="file"
        id="videoInput"
        accept="video/*">

    <video
        id="video"
        controls
        playsinline>
    </video>

    <button id="scanBtn">
        Bắt đầu quét
    </button>

    <div id="status">
        Chưa chọn video
    </div>

    <progress
        id="progress"
        value="0"
        max="100">
    </progress>

    <h2>Danh sách mã</h2>

    <textarea
        id="result"
        rows="12"
        readonly>
    </textarea>

    <h2>QR</h2>

    <canvas id="qrCanvas"></canvas>

    <div class="nav">

        <button id="prevBtn">
            ◀ Trước
        </button>

        <span id="currentIndex">
            0 / 0
        </span>

        <button id="nextBtn">
            Tiếp ▶
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
